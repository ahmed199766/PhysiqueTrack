name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project PhysiqueTrack.xcodeproj \
            -scheme PhysiqueTrack \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "PhysiqueTrack.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: PhysiqueTrack.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r PhysiqueTrack.ipa Payload
          ls -lh PhysiqueTrack.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhysiqueTrack-IPA
          path: PhysiqueTrack.ipa
          retention-days: 30
